<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deepseek</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 250px);
        }
        .message {
            max-width: 85%;
            margin: 8px;
            padding: 12px;
            border-radius: 8px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: auto;
        }
        .assistant-message {
            background-color: #f5f5f5;
            margin-right: auto;
        }
        .thinking-message {
            background-color: #fff3e0;
            margin: 8px;
            padding: 12px;
            border-radius: 8px;
            font-style: italic;
            border-left: 4px solid #ffb74d;
        }
        .system-message {
            background-color: #fafafa;
            margin: 8px auto;
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }
        pre {
            background-color: #282c34;
            color: #abb2bf;
            padding: 1em;
            border-radius: 4px;
            overflow-x: auto;
            margin: 0.5em 0;
        }
        code {
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .message-group {
            margin: 16px 0;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 侧边栏样式 */
        .page-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            padding: 1rem;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
        }
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 1rem;
        }
        .conversation-item {
            padding: 0.5rem;
            margin: 0.25rem 0;
            border-radius: 0.375rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conversation-item:hover {
            background-color: #e9ecef;
        }
        .conversation-item.active {
            background-color: #e3f2fd;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="page-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">对话历史</h2>
                <!-- <button onclick="newConversation()" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">
                    新建
                </button> -->
            </div>
            <div id="conversationList">
                <!-- 对话列表将通过 JavaScript 动态添加 -->
            </div>
        </div>

        <!-- 主要内容区 -->
        <div class="main-content">
            <div class="container mx-auto p-4">
                <div class="bg-white rounded-lg shadow-lg p-4">
                    <div class="flex items-center justify-between mb-4">
                        <h1 class="text-xl font-bold">GCAI珠宝deepseek营销大模型</h1>
                        <div class="flex space-x-2">
                            <select id="modelSelect" class="px-4 py-2 border rounded">
                                <option value="deepseek-r1">Deepseek R1</option>
                            </select>
                            <button id="clearChat" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">清除对话</button>
                            <button id="exportChat" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">导出对话</button>
                        </div>
                    </div>
                    
                    <div id="chatMessages" class="chat-container overflow-y-auto border rounded-lg p-4 mb-4">
                        <!-- 消息内容将通过 JavaScript 动态添加 -->
                    </div>

                    <div class="flex space-x-2">
                        <textarea id="userInput" class="flex-1 p-2 border rounded-lg resize-none" rows="3" 
                            placeholder="输入消息，按Enter发送，Shift+Enter换行..."></textarea>
                        <div class="flex flex-col space-y-2">
                            <button id="sendMessage" class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">发送</button>
                            <button id="stopGeneration" class="px-6 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600" style="display: none;">停止</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentConversationId = '1';
        let currentThinkingDiv = null;
        let currentMessageDiv = null;
        let controller = null;
        let conversationHistory = [];  // 用于保存对话历史

        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chatMessages');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendMessage');
            const stopButton = document.getElementById('stopGeneration');
            const clearButton = document.getElementById('clearChat');
            const exportButton = document.getElementById('exportChat');
            const modelSelect = document.getElementById('modelSelect');

            loadConversations();

            function addMessage(content, type = 'assistant') {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}-message`;
                messageDiv.textContent = content;
                
                // 创建或获取消息组
                let messageGroup;
                if (type === 'user') {
                    messageGroup = document.createElement('div');
                    messageGroup.className = 'message-group';
                    chatMessages.appendChild(messageGroup);
                    // 保存用户消息到历史
                    conversationHistory.push({
                        role: 'user',
                        content: content
                    });
                }
                
                const lastGroup = chatMessages.lastElementChild;
                messageGroup = type === 'user' ? lastGroup : 
                             (lastGroup && !lastGroup.querySelector('.assistant-message') ? lastGroup : null);
                
                if (!messageGroup) {
                    messageGroup = document.createElement('div');
                    messageGroup.className = 'message-group';
                    chatMessages.appendChild(messageGroup);
                }
                
                messageGroup.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return messageDiv;
            }

            function appendToMessage(content, type) {
                if (type === 'thinking') {
                    if (!currentThinkingDiv) {
                        const groupDiv = chatMessages.lastElementChild || 
                                       document.createElement('div');
                        groupDiv.className = 'message-group';
                        
                        const label = document.createElement('div');
                        label.className = 'system-message';
                        label.textContent = '思考过程：';
                        groupDiv.appendChild(label);
                        
                        currentThinkingDiv = document.createElement('div');
                        currentThinkingDiv.className = 'thinking-message';
                        groupDiv.appendChild(currentThinkingDiv);
                        
                        if (!chatMessages.lastElementChild) {
                            chatMessages.appendChild(groupDiv);
                        }
                    }
                    currentThinkingDiv.textContent = (currentThinkingDiv.textContent || '') + content;
                } else if (type === 'answer') {
                    if (!currentMessageDiv) {
                        const groupDiv = chatMessages.lastElementChild;
                        if (!groupDiv) return;
                        
                        currentMessageDiv = document.createElement('div');
                        currentMessageDiv.className = 'message assistant-message';
                        groupDiv.appendChild(currentMessageDiv);
                    }
                    currentMessageDiv.textContent = (currentMessageDiv.textContent || '') + content;
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            async function sendMessage() {
                const message = userInput.value.trim();
                if (!message) return;

                // 禁用输入和发送按钮
                userInput.disabled = true;
                sendButton.disabled = true;
                stopButton.style.display = 'block';

                // 添加用户消息
                addMessage(message, 'user');
                userInput.value = '';

                // 重置当前消息变量
                currentMessageDiv = null;
                currentThinkingDiv = null;
                let currentThinking = '';
                let currentAnswer = '';

                try {
                    controller = new AbortController();
                    const response = await fetch('/chatbox08/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: message,
                            model: modelSelect.value,
                            conversation_id: currentConversationId
                        }),
                        signal: controller.signal
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    
                    while (true) {
                        const {value, done} = await reader.read();
                        if (done) break;
                        
                        const text = decoder.decode(value);
                        const lines = text.split('\n');
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    if (data.type === 'error') {
                                        addMessage(data.content, 'system');
                                    } else if (data.type === 'thinking') {
                                        currentThinking += data.content;
                                        appendToMessage(data.content, 'thinking');
                                    } else if (data.type === 'answer') {
                                        currentAnswer += data.content;
                                        appendToMessage(data.content, 'answer');
                                    } else if (data.type === 'complete') {
                                        // 保存完整的回答到历史
                                        conversationHistory.push({
                                            role: 'assistant',
                                            content: data.answer,
                                            thinking: data.thinking
                                        });
                                    }
                                } catch (e) {
                                    console.error('解析响应数据出错:', e);
                                }
                            }
                        }
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        addMessage('生成已停止', 'system');
                    } else {
                        addMessage('网络错误，请检查连接。', 'system');
                        console.error('发生错误:', error);
                    }
                } finally {
                    // 恢复输入和发送按钮
                    userInput.disabled = false;
                    sendButton.disabled = false;
                    stopButton.style.display = 'none';
                    controller = null;
                }
            }

            exportButton.addEventListener('click', function() {
                // 从页面获取所有对话内容
                const chatMessages = document.getElementById('chatMessages');
                const messages = [];
                
                // 遍历所有消息组
                chatMessages.querySelectorAll('.message-group').forEach(group => {
                    // 获取用户消息
                    const userMessage = group.querySelector('.user-message');
                    if (userMessage) {
                        messages.push({
                            role: 'user',
                            content: userMessage.textContent
                        });
                    }
                    
                    // 获取助手消息
                    const assistantMessage = group.querySelector('.assistant-message');
                    if (assistantMessage) {
                        const thinkingMessage = group.querySelector('.thinking-message');
                        messages.push({
                            role: 'assistant',
                            content: assistantMessage.textContent,
                            thinking: thinkingMessage ? thinkingMessage.textContent.replace('思考过程：', '') : ''
                        });
                    }
                });

                // 生成HTML内容
                const html_content = [
                    '<!DOCTYPE html>',
                    '<html>',
                    '<head>',
                    '<meta charset="utf-8">',
                    '<title>GCAI对话记录</title>',
                    '<style>',
                    'body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }',
                    '.message { margin: 10px 0; padding: 10px; border-radius: 5px; white-space: pre-wrap; }',
                    '.user-message { background-color: #e3f2fd; margin-left: 20%; }',
                    '.assistant-message { background-color: #f5f5f5; margin-right: 20%; }',
                    '.thinking-message { background-color: #fff3e0; border-left: 4px solid #ffb74d; font-style: italic; margin-bottom: 10px; }',
                    '.system-message { text-align: center; color: #666; }',
                    'pre { background-color: #282c34; color: #abb2bf; padding: 1em; border-radius: 4px; overflow-x: auto; }',
                    'code { font-family: Consolas, Monaco, monospace; }',
                    '.message-group { margin: 20px 0; }',
                    '</style>',
                    '</head>',
                    '<body>',
                    '<h1>GCAI对话记录</h1>',
                    '<div class="chat-container">'
                ];

                // 添加消息内容
                messages.forEach(msg => {
                    html_content.push('<div class="message-group">');
                    if (msg.role === 'user') {
                        html_content.push(`<div class="message user-message">${msg.content}</div>`);
                    } else if (msg.role === 'assistant') {
                        if (msg.thinking) {
                            html_content.push(`<div class="thinking-message">思考过程：${msg.thinking}</div>`);
                        }
                        html_content.push(`<div class="message assistant-message">${msg.content}</div>`);
                    }
                    html_content.push('</div>');
                });

                html_content.push('</div></body></html>');

                // 创建Blob并下载
                const blob = new Blob([html_content.join('\n')], { type: 'text/html;charset=utf-8' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `对话记录_${new Date().toISOString().slice(0,19).replace(/[:-]/g, '')}.html`;
                
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            });

            // 在切换对话时清空历史
            function clearChat() {
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                currentThinkingDiv = null;
                currentMessageDiv = null;
                conversationHistory = [];  // 清空对话历史
                
                fetch('/chatbox08/clear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        conversation_id: currentConversationId
                    })
                });
            }

            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendButton.addEventListener('click', sendMessage);

            stopButton.addEventListener('click', function() {
                if (controller) {
                    controller.abort();
                }
            });

            clearButton.addEventListener('click', function() {
                if (confirm('确定要清除当前对话吗？')) {
                    clearChat();
                }
            });

            function loadConversations() {
                fetch('/chatbox08/conversations')
                    .then(response => response.json())
                    .then(data => {
                        const conversationList = document.getElementById('conversationList');
                        conversationList.innerHTML = '';
                        data.conversations.forEach(conv => {
                            const div = document.createElement('div');
                            div.className = `conversation-item ${conv.id === currentConversationId ? 'active' : ''}`;
                            div.innerHTML = `
                                <span>${conv.title}</span>
                                <button onclick="deleteConversation('${conv.id}')" class="text-red-500 hover:text-red-700">
                                    ×
                                </button>
                            `;
                            div.onclick = (e) => {
                                if (e.target.tagName !== 'BUTTON') {
                                    switchConversation(conv.id);
                                }
                            };
                            conversationList.appendChild(div);
                        });
                    });
            }

            function newConversation() {
                fetch('/chatbox08/conversations', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    currentConversationId = data.conversation.id;
                    clearChat();
                    loadConversations();
                });
            }

            function deleteConversation(id) {
                if (confirm('确定要删除这个对话吗？')) {
                    fetch(`/chatbox08/conversations?id=${id}`, {
                        method: 'DELETE'
                    })
                    .then(() => {
                        if (id === currentConversationId) {
                            currentConversationId = '1';
                            clearChat();
                        }
                        loadConversations();
                    });
                }
            }

            function switchConversation(id) {
                currentConversationId = id;
                clearChat();
                loadConversations();
            }
        });
    </script>
</body>
</html>
